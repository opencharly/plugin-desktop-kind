#  opencharly/plugin-desktop-kind — the theme/session/displaymanager/desktopentry kinds.
#
#  OUT-OF-PROCESS placement: these words are consumed only at candy-compile time, when
#  project plugins are already loaded, so adopting them needs no charly change.
